[index]
root = "."
database = ".rag-rat/index.sqlite"

[llm.embedding]
# The MODEL by its full id (the HF path). all-MiniLM-L6-v2 (384-dim) — served over this box's local
# Ollama below (CONNECT mode) instead of in-process. "none" disables embeddings; the static
# model2vec tier (minishlab/potion-retrieval-32M) is the no-Ollama-dependency alternative.
model = "sentence-transformers/all-MiniLM-L6-v2"

# Serve that model over the local Ollama (`ollama pull all-minilm`) — see docs/config.md "Remote
# embedding over Ollama". CONNECT = a fixed endpoint; reconcile + queries both embed against it. If
# the Ollama is unreachable, reconcile leaves embeddings pending and semantic_search degrades to
# BM25 (so a contributor without Ollama still gets a working lexical index). The mode is INFERRED:
# set EXACTLY ONE of `endpoint` (connect) or `cookbook` (provision an ephemeral box).
[llm.embedding.remote]
endpoint = "http://localhost:11434"   # this box's Ollama server
model = "all-minilm"                  # the Ollama-side model name
batch_size = 256                      # texts per /api/embed request
# To EPHEMERALLY provision a box instead, drop `endpoint` and set `cookbook` (see docs/config.md).
# Only then may you pick the GPU (a connect endpoint + gpu is rejected):
# gpu = "A10G"                        # cookbook-only; Modal GPU class / RunPod gpuTypeId

[llm.embedding.runtime]
batch_size = 64
ort_threads = 4
omp_threads = 1
max_embedding_chars = 4000

[target_bindings]
rust = ["crates"]
markdown = ["docs"]
