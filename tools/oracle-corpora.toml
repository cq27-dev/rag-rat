# SCIP-oracle corpus profiles (#164, C1). Declarative inputs for the resolution-quality runner:
# each entry pins a real repo + revision + SCIP tool + per-language prepare steps + health gates.
#
# Two tiers:
#   small — run per-PR (fast clone + build + index); the before/after delta comment gate.
#   heavy — release/dispatch only; the Bencher headline resolution series. Never on PRs.
#
# Every field is part of the profile HASH (corpus_profile_hash), so changing a repo/rev/tool/prepare/
# binding/threshold makes prior reports "incomparable" rather than silently mis-diffed. Pin `rev` to
# an immutable ref; tags below are resolved to their commit at clone time by the runner.
#
# NOTE: `rev`s are release tags as a first cut — pin to the tag's commit SHA before trusting the
# Bencher series (a moved tag would silently change the corpus). The golden hash test in
# `oracle/corpus.rs` pins each profile's hash, so any edit here surfaces in review.

# The small-tier corpora are sized to a comparable scale (~8k–12k heuristic edges each) so the
# report table's per-language rows are roughly equal and substantial — measured `total_edges`:
# rust-time ~11.1k, c-libuv ~12.3k, py-rich ~8.4k, ts-rxjs ~7.9k, cpp-yaml ~9.2k. Each corpus's
# health floors sit well below its measured numbers (catch a broken parse / unresolved deps), not as
# exact regression gates. (cpp-yaml is the exception — its floors guard `.h` header resolution.)

[[corpus]]
corpus_id = "rust-time"
tier      = "small"
repo      = "https://github.com/time-rs/time"
rev       = "v0.3.36"
tool      = "rust-analyzer"
prepare   = ["cargo fetch"]
bindings  = { rust = ["time/src"] }
health    = { expected_min_heuristic_edges = 6000, expected_min_oracle_examined = 2000, expected_max_skipped_drifted = 0, expected_min_symbols_with_moniker = 250, timeout_minutes = 10 }

[[corpus]]
corpus_id = "c-libuv"
tier      = "small"
repo      = "https://github.com/libuv/libuv"
rev       = "v1.48.0"
tool      = "scip-clang"
prepare   = ["cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON", "cp build/compile_commands.json ."]
bindings  = { c = ["src"] }
health    = { expected_min_heuristic_edges = 7000, expected_min_oracle_examined = 1500, expected_max_skipped_drifted = 0, expected_min_symbols_with_moniker = 300, timeout_minutes = 10 }

[[corpus]]
corpus_id = "py-rich"
tier      = "small"
repo      = "https://github.com/Textualize/rich"
rev       = "v13.8.1"
tool      = "scip-python"
# `pip install .` resolved rich's deps through ranges (pygments `^2.13`, markdown-it-py `>=2.2`), so
# an upstream release could shift what scip-python sees while the profile hash — which records only
# the command string — stayed "comparable" (#185 item 3). Pin rich v13.8.1's full resolved runtime
# tree inline (these versions are now part of the hashed prepare command, so a bump is a deliberate,
# reviewable profile change). `npm ci`'s pip analog.
prepare   = ["python -m venv .venv", ".venv/bin/pip install . \"markdown-it-py==4.2.0\" \"mdurl==0.1.2\" \"pygments==2.20.0\""]
bindings  = { python = ["rich"] }
health    = { expected_min_heuristic_edges = 5000, expected_min_oracle_examined = 4000, expected_max_skipped_drifted = 0, expected_min_symbols_with_moniker = 500, timeout_minutes = 12 }

[[corpus]]
corpus_id = "ts-rxjs"
tier      = "small"
repo      = "https://github.com/ReactiveX/rxjs"
rev       = "7.8.1"
tool      = "scip-typescript"
# scip-typescript resolves cross-package references against the installed `node_modules` (the analog
# of scip-python's venv); `npm install` makes them present. It requires a root `tsconfig.json` (rxjs
# ships one) — the backend deliberately does NOT pass `--infer-tsconfig` (read-only-on-source). Bind
# `src/internal` (the library implementation) rather than the whole `src` re-export surface.
#
# `expected_min_resolved_external` (#185) is the dependency-resolution floor for this npm-style
# backend: scip-typescript mints local package monikers from package.json REGARDLESS of whether
# node_modules is installed, so `symbols_with_moniker` (~626 measured) stays high even on a
# missing-deps run — only EXTERNAL resolution collapses. Measured `resolved_external` ~2534 with
# node_modules present; the 1000 floor catches a missing-`npm install` run (external resolution drops
# toward zero) while sitting well below the healthy number. The non-npm backends leave it unset
# (external resolution isn't their dep signal; rust/c use cargo fetch / the compdb).
# `npm ci` (not `npm install`) installs from rxjs's COMMITTED package-lock.json — a deterministic
# dependency tree — so a transitive npm release can't shift the types/compiler inputs scip-typescript
# sees while the profile hash stays "comparable" (#185 item 3). rxjs 7.8.1 ships a package-lock.json,
# which `npm ci` requires.
prepare   = ["npm ci --no-audit --no-fund"]
bindings  = { typescript = ["src/internal"] }
health    = { expected_min_heuristic_edges = 5000, expected_min_oracle_examined = 3500, expected_max_skipped_drifted = 0, expected_min_symbols_with_moniker = 300, expected_min_resolved_external = 1000, timeout_minutes = 15 }

[[corpus]]
corpus_id = "cpp-yaml"
tier      = "small"
repo      = "https://github.com/jbeder/yaml-cpp"
rev       = "0.8.0"
tool      = "scip-clang"
# C++ counterpart to the C `c-cjson` corpus — exercises classes / methods / overloads (the C++
# resolution lever, logical_variant tiebreak) AND C++ header resolution: yaml-cpp's API is declared
# in `include/yaml-cpp/*.h` and defined across ~31 `src/*.cpp` TUs. Binding BOTH dirs as `cpp` indexes
# the `.h` headers as C++ too (a `cpp` binding claims `.h` — see Language::target_extensions), so
# calls to header-declared methods resolve to their in-corpus definitions instead of going external.
# Tests/tools off keeps the build to the library TUs; scip-clang indexes all 31 in a couple seconds.
prepare   = ["cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DYAML_CPP_BUILD_TESTS=OFF -DYAML_CPP_BUILD_TOOLS=OFF", "cp build/compile_commands.json ."]
bindings  = { cpp = ["src", "include"] }
# Thresholds sit ABOVE the src-only baseline (no `.h` indexed: ~4600 edges, ~3400 examined, ~350
# monikers) and below the src+include run (~9200 / ~5800 / ~1040), so this corpus actually GUARDS C++
# header resolution: if `.h` indexing regresses, the run collapses to the src-only numbers and trips
# the gate instead of passing green.
health    = { expected_min_heuristic_edges = 7000, expected_min_oracle_examined = 4500, expected_max_skipped_drifted = 0, expected_min_symbols_with_moniker = 700, timeout_minutes = 12 }

# --- heavy "headline" corpora: release/dispatch only, pushed to Bencher; excluded from the PR matrix.

[[corpus]]
corpus_id = "rust-cargo"
tier      = "heavy"
repo      = "https://github.com/rust-lang/cargo"
rev       = "0.97.1"
tool      = "rust-analyzer"
prepare   = ["cargo fetch"]
bindings  = { rust = ["src", "crates"] }
health    = { expected_min_heuristic_edges = 5000, expected_min_oracle_examined = 1000, expected_max_skipped_drifted = 0, expected_min_symbols_with_moniker = 200, timeout_minutes = 45 }

[[corpus]]
corpus_id = "linux-kernel"
tier      = "heavy"
repo      = "https://github.com/torvalds/linux"
rev       = "v7.0"
tool      = "scip-clang"
# The compile_commands.json target reads per-object `.cmd` files, so the kernel must be BUILT first.
# Without the build the compdb is empty and scip-clang sees nothing. `-j$(nproc)` bounds the build to
# the core count — a bare `make -j` is UNLIMITED jobs and oversubscribes the box's CPU/RAM (#177).
prepare   = ["make defconfig", "make -j$(nproc)", "make compile_commands.json"]
bindings  = { c = ["."] }
health    = { expected_min_heuristic_edges = 50000, expected_min_oracle_examined = 5000, expected_max_skipped_drifted = 0, expected_min_symbols_with_moniker = 1000, timeout_minutes = 120 }
