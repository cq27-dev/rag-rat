name: oracle-rust

# Repeatable Rust edge-resolution demo: index rust-lang/cargo, run the rust-analyzer SCIP oracle over
# the whole workspace, and record the heuristic-vs-compiler resolution delta in Bencher (#61, the
# Rust sibling of oracle-kernel.yml's C/scip-clang demo). rust-analyzer's whole-program analysis is
# heavyweight (memory + a few minutes), so dispatch-only — never per-push. See
# tools/rust-scip-oracle.sh and docs/bencher.md.

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  BENCHER_PROJECT: rag-rat
  BENCHER_TESTBED: hetzner-bigmem
  BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
  CARGO_TAG: 0.97.1

jobs:
  rust-oracle:
    # Same self-hosted big-memory box as bench-release / oracle-kernel: rust-analyzer's whole-crate
    # analysis of cargo wants the RAM, and rust-analyzer is installed in the bench image. Dispatch-
    # only (never PRs), so a public-repo self-hosted runner is safe.
    runs-on: [self-hosted, bigmem]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # Pinned bench environment (#71): rust-analyzer + the Rust toolchain live in the image, so the
      # SCIP indexer version is reproducible (it's the content-addressed `tool_version` baked into
      # every verdict). Layer-cached on the runner.
      - name: Build bench image
        run: docker build -t rag-rat-bench -f tools/bench.Containerfile .

      - name: Run the rust-analyzer oracle over cargo and emit BMF
        # Mount the checkout at /repo (BMF lands here, on the host) and runner.temp at /work (the
        # corpus checkout + index DB stay on real disk, not the container overlay). Named volumes
        # cache cargo + target across runs. rag-rat is built inside the image's pinned toolchain,
        # then the script runs.
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            -v "${{ runner.temp }}":/work \
            -v rag-rat-cargo-registry:/usr/local/cargo/registry \
            -v rag-rat-target:/repo/target \
            -e CARGO_TAG="$CARGO_TAG" \
            -e BMF_OUT=/work/rust_scip_oracle_bmf.json \
            -e RUST_WORK=/work/rustoracle-${{ github.run_id }} \
            -e RAG_RAT_BIN=/repo/target/release/rag-rat \
            rag-rat-bench \
            bash -c 'cargo build --release --no-default-features --bin rag-rat && bash tools/rust-scip-oracle.sh'

      - uses: bencherdev/bencher@main

      # No --err: this is a headline resolution signal, not a gate. A regression shows in the plots.
      - name: Track Rust edge resolution (Bencher)
        run: |
          bencher run \
            --branch main \
            --adapter json \
            --file "${{ runner.temp }}/rust_scip_oracle_bmf.json" \
            --project "$BENCHER_PROJECT" \
            --testbed "$BENCHER_TESTBED"

      - name: Upload oracle report + BMF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-scip-oracle
          path: |
            ${{ runner.temp }}/rust_scip_oracle_bmf.json
            ${{ runner.temp }}/rustoracle-${{ github.run_id }}/oracle-report.json
