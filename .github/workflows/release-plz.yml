name: Release-plz

# release-plz runs in two halves on every push to main:
#   - release-plz-pr opens/updates a "Release" PR with the lockstep version bump + changelog;
#   - release-plz-release fires once that PR's version commit lands, tagging + publishing.
# Config (lockstep version_group, single tag/release, combined CHANGELOG) lives in release-plz.toml.
#
# AUTH: both jobs use a `RELEASE_PLZ_TOKEN` repo secret, NOT the default GITHUB_TOKEN. The cq27-dev
# org disables "Allow GitHub Actions to create and approve pull requests", which makes the default
# token 403 when release-plz opens the release PR (the repo-level toggle is greyed out under that
# org policy). A fine-grained PAT or GitHub App token (contents: write + pull-requests: write) sidesteps
# it — and, per release-plz's own guidance, lets the release PR and the version tag trigger downstream
# workflows (GITHUB_TOKEN-authored refs do not, which would skip CI on the release PR and the v*-tagged
# ios.yml). Create the token, add it as the `RELEASE_PLZ_TOKEN` secret, then this workflow goes green.
on:
  push:
    branches:
      - main

# Least privilege at the top; each job grants only what it needs.
permissions: {}

jobs:
  # Maintain the release PR: version bump + changelog, held for human review before anything ships.
  release-plz-pr:
    name: Release-plz PR
    # Never cut releases from a fork.
    if: ${{ github.repository_owner == 'cq27-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Serialize PR updates so two pushes don't race on the same release branch.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run release-plz
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # release-plz bumps Cargo.toml but not the plugin JSON manifests, and it has no non-Cargo-file
      # support. The launcher fetches releases/download/v<plugin-version>, so the manifests must match
      # the crate version — sync them into the SAME Release PR release-plz just opened/updated. This
      # runs after release-plz every time, so its force-push of the PR branch can never leave the
      # manifests stale. Pushes to the release-plz-* branch (never main), so it triggers nothing.
      - name: Sync plugin manifest versions into the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          branch="$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-plz-"))][0].headRefName // ""')"
          if [ -z "$branch" ]; then echo "no open release-plz PR — nothing to sync"; exit 0; fi
          echo "release PR branch: $branch"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          node tools/sync-plugin-version.mjs
          if git diff --quiet; then echo "manifests already in sync"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "chore: sync plugin manifest versions to the workspace version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$branch"

  # When the release PR merges (the version commit lands on main), tag, publish each crate to
  # crates.io, and create the GitHub release. No concurrency guard here — we never want a release
  # skipped because commits arrived quickly.
  release-plz-release:
    name: Release-plz release
    if: ${{ github.repository_owner == 'cq27-dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # release-plz inspects the merged Release PR and its commits to build the release.
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run release-plz
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
