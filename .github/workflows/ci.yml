name: CI

on:
  # The workspace fmt/clippy/test/build/coverage gate — stays broad over ALL code (it's the only
  # --workspace lint+test pass), but a docs-only change can't break it, so skip pure-docs changes.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Least privilege: CI only reads the repo (codecov uploads use its own token, not GITHUB_TOKEN).
permissions:
  contents: read

# Newer pushes to the same branch/PR cancel older in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep ort-sys' downloaded ONNX Runtime under target/ so rust-cache restores the
  # native library together with build-script link metadata.
  ORT_CACHE_DIR: ${{ github.workspace }}/target/ort-cache

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustfmt.toml uses nightly-only options (struct_lit_style, imports_granularity, …),
      # so the format check must run on nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --no-default-features = hash-only build: no ONNX/model downloads, fast and network-free.
      # This lints the cfg(not(feature = ...)) branches; the feature-gated code is linted by the
      # clippy-all-features job below.
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  clippy-all-features:
    name: clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The all-features graph compiles ort/fastembed, which downloads the ONNX runtime; force
      # ort-sys to re-emit its link metadata for the current cache location (matches build-full).
      - run: cargo clean -p ort-sys
      # Lints fastembed, model2vec, and eval — the feature-gated code the --no-default-features
      # clippy job never compiles.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Hash embedder only (no model downloads). Tests run in parallel; the `ci` profile emits a
      # JUnit report at target/nextest/ci/junit.xml.
      - name: Run tests (nextest)
        run: cargo nextest run --workspace --no-default-features --locked --profile ci
      - name: Upload test results to Codecov
        # Upload even when tests fail, so failures show up in Codecov Test Analytics.
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: target/nextest/ci/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-full:
    name: build (fastembed + model2vec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-cache restore keys can bring back ort-sys link metadata from before ORT_CACHE_DIR was
      # target-local. Force the build script to re-emit -L for the current cache location.
      - run: cargo clean -p ort-sys
      # Compile the default feature set (downloads the ONNX runtime once, then cached) so the
      # released binary's embedding paths never break silently.
      - run: cargo build --workspace --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --no-default-features --locked --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          # Tokenless upload works for public repos; CODECOV_TOKEN is used if the secret is set.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lens-extension:
    name: vscode lens extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # Strict typecheck, dual Node/web production bundles, transport tests, and a clean
      # dependency audit — the whole TS tree is otherwise invisible to CI (#216).
      - run: npm ci && npm run package && npm test && npm audit --audit-level=moderate
        working-directory: editors/vscode
      # Packaging smoke: the published VSIX must build from a clean checkout with no runtime
      # dependencies (both Node and web bundles are pre-built by `vscode:prepublish`).
      - run: npx --yes @vscode/vsce package --no-dependencies --out /tmp/rag-rat-lens.vsix
        working-directory: editors/vscode
