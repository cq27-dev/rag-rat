name: CI

on:
  # The workspace fmt/clippy/test/build/coverage gate — stays broad over ALL code (it's the only
  # --workspace lint+test pass), but a docs-only change can't break it, so skip pure-docs changes.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Least privilege: CI only reads the repo (codecov uploads use its own token, not GITHUB_TOKEN).
permissions:
  contents: read

# Same-repository work runs on the self-hosted `ci` runners. A pull request from a fork is untrusted
# code and stays on a hosted runner — the only place it may execute. Each self-hosted runner's own
# `.env` sets `CARGO_TARGET_DIR` outside the checkout (which `actions/checkout` cleans), so its
# target dir stays warm from job to job; the GitHub cache round-trip runs only on the ephemeral
# runners (GitHub-hosted, Ubicloud), which start empty every time — told apart by our runners'
# `hetzner-` names. A fork's pull request runs on Ubicloud: an ephemeral VM outside the hosted
# pool's concurrency cap.
#
# Newer pushes to the same branch/PR cancel older in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep ort-sys' downloaded ONNX Runtime under target/ so rust-cache restores the
  # native library together with build-script link metadata.
  ORT_CACHE_DIR: ${{ github.workspace }}/target/ort-cache

jobs:
  fmt:
    name: rustfmt
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && 'ci' || 'ubicloud-standard-4' }}
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml uses nightly-only options (struct_lit_style, imports_granularity, …),
      # so the format check must run on nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Test runner cache cleanup safeguards
        run: python3 tools/test-runner-cache-cleanup.py

      - name: Trim this runner's build cache
        if: ${{ always() && startsWith(runner.name, 'hetzner-') }}
        uses: ./.github/actions/runner-cache-cleanup

  clippy:
    name: clippy
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && 'ci' || 'ubicloud-standard-4' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ !startsWith(runner.name, 'hetzner-') }}
      # --no-default-features = hash-only build: no ONNX/model downloads, fast and network-free.
      # This lints the cfg(not(feature = ...)) branches; the feature-gated code is linted by the
      # clippy-all-features job below.
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

      - name: Trim this runner's build cache
        if: ${{ always() && startsWith(runner.name, 'hetzner-') }}
        uses: ./.github/actions/runner-cache-cleanup

  clippy-all-features:
    name: clippy (all features)
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && 'ci' || 'ubicloud-standard-4' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ !startsWith(runner.name, 'hetzner-') }}
      # The all-features graph compiles ort/fastembed, which downloads the ONNX runtime; force
      # ort-sys to re-emit its link metadata for the current cache location (matches build-full).
      - run: cargo clean -p ort-sys
      # Lints fastembed, model2vec, and eval — the feature-gated code the --no-default-features
      # clippy job never compiles.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Trim this runner's build cache
        if: ${{ always() && startsWith(runner.name, 'hetzner-') }}
        uses: ./.github/actions/runner-cache-cleanup

  test:
    name: test
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && 'ci' || 'ubicloud-standard-4' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: ${{ !startsWith(runner.name, 'hetzner-') }}
      - uses: taiki-e/install-action@nextest
        # install-action stages downloads in $HOME/.install-action/tmp and deletes it when done. The
        # persistent runners share one $HOME, so concurrent jobs truncate each other's archives
        # ("gzip: unexpected end of file"). The job temp dir is per runner and wiped every job.
        env:
          HOME: ${{ runner.temp }}
      # Hash embedder only (no model downloads). Tests run in parallel; the `ci` profile emits a
      # JUnit report at target/nextest/ci/junit.xml — nextest's store dir is workspace-relative, so
      # this holds wherever the cargo target dir points.
      - name: Run tests (nextest)
        run: cargo nextest run --workspace --no-default-features --locked --profile ci
      - name: Upload test results to Codecov
        # Upload even when tests fail, so failures show up in Codecov Test Analytics.
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: target/nextest/ci/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Trim this runner's build cache
        if: ${{ always() && startsWith(runner.name, 'hetzner-') }}
        uses: ./.github/actions/runner-cache-cleanup

  build-full:
    name: build (fastembed + model2vec)
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && 'ci' || 'ubicloud-standard-4' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: ${{ !startsWith(runner.name, 'hetzner-') }}
      # rust-cache can restore a PARTIAL ort-sys download — a cache marker present but the native
      # onnxruntime lib missing — so `cargo clean` alone re-emits link metadata pointing at a lib
      # that isn't there ("could not find native static library `onnxruntime`"). Nuke the downloaded
      # cache too so the build script re-downloads it clean and a poisoned cache can't resurface.
      - run: |
          cargo clean -p ort-sys
          rm -rf "$ORT_CACHE_DIR"
      # Compile the default feature set (re-downloads the ONNX runtime) so the released binary's
      # embedding paths never break silently.
      - run: cargo build --workspace --locked

      - name: Trim this runner's build cache
        if: ${{ always() && startsWith(runner.name, 'hetzner-') }}
        uses: ./.github/actions/runner-cache-cleanup

  coverage:
    name: coverage
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && 'ci' || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: ${{ !startsWith(runner.name, 'hetzner-') }}
      - uses: taiki-e/install-action@cargo-llvm-cov
        # Per-runner staging dir; the persistent runners share $HOME (see the test job).
        env:
          HOME: ${{ runner.temp }}
      # The instrumented build is ~18 GB and identical on every persistent runner; one shared dir
      # instead of one per runner keeps it warm for all of them and stores it once. Cargo's own lock
      # covers only the build, not llvm-cov's clean/test/report cycle, so the whole command runs
      # under a host-wide lock: two coverage jobs on the box run one after the other.
      - name: Share the instrumented build between the persistent runners
        if: ${{ startsWith(runner.name, 'hetzner-') }}
        run: |
          echo "CARGO_TARGET_DIR=$HOME/cargo-target-coverage" >> "$GITHUB_ENV"
          echo "COVERAGE_LOCK=$HOME/cargo-target-coverage.lock" >> "$GITHUB_ENV"
      - name: Generate coverage (lcov)
        run: |
          if [ -n "${COVERAGE_LOCK:-}" ]; then
            exec flock "$COVERAGE_LOCK" cargo llvm-cov --workspace --no-default-features --locked --lcov --output-path lcov.info
          fi
          cargo llvm-cov --workspace --no-default-features --locked --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # Tokenless upload works for public repos; CODECOV_TOKEN is used if the secret is set.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Trim this runner's build cache
        if: ${{ always() && startsWith(runner.name, 'hetzner-') }}
        uses: ./.github/actions/runner-cache-cleanup

  lens-extension:
    name: vscode lens extension
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && 'ci' || 'ubicloud-standard-4' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # Strict typecheck, dual Node/web production bundles, promise-safety lint, transport tests,
      # and a clean dependency audit — the whole TS tree is otherwise invisible to CI (#216).
      # `lint` runs after `package` so a type error reports as a type error rather than as the
      # type-aware rules failing to resolve.
      - run: npm ci && npm run package && npm run lint && npm test && npm audit --audit-level=moderate
        working-directory: editors/vscode
      # Packaging smoke: the published VSIX must build from a clean checkout with no runtime
      # dependencies (both Node and web bundles are pre-built by `vscode:prepublish`).
      - run: npx --yes @vscode/vsce package --no-dependencies --out "$RUNNER_TEMP/rag-rat-lens.vsix"
        working-directory: editors/vscode

      - name: Trim this runner's build cache
        if: ${{ always() && startsWith(runner.name, 'hetzner-') }}
        uses: ./.github/actions/runner-cache-cleanup
