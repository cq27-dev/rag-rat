name: bench-pr-track

# Fork-safe step 2 of 2: triggered by bench-pr-run completing. Runs in the BASE repo context, so it
# can read BENCHER_API_TOKEN and comment on the PR — but it only ever consumes the artifact produced
# by step 1, never the fork's code, so the token stays out of fork-controlled execution.
# Pattern mirrors Bencher's "Track Benchmarks with GitHub Actions" (fork PRs) docs.

on:
  workflow_run:
    workflows: [bench-pr-run]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful bench-pr-run workflow run to publish
        required: true
        type: string
      artifact_id:
        description: Exact benchmark_results artifact from the latest successful attempt
        required: true
        type: string

permissions:
  actions: read
  contents: read
  # `bencher run --github-actions` posts BOTH a GitHub Check and a PR comment, so the tracker needs
  # checks:write (specifying a permissions map sets omitted scopes to none) — Bencher's fork-PR
  # example grants both. Without it the Check publish/update fails after the artifact download.
  checks: write
  pull-requests: write

env:
  BENCHER_PROJECT: rag-rat
  # Where bench-pr-run measures: the self-hosted benchmark runner (see bench-pr-run.yml).
  BENCHER_TESTBED: hetzner-bigmem
  # The secret holds a Bencher *project key* (`bencher_run_…`) — use the --key auth path
  # (BENCHER_API_KEY), not the account-JWT path (BENCHER_API_TOKEN). See docs/bencher.md.
  BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}

jobs:
  track:
    # Only proceed if step 1's benchmarks actually succeeded.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubicloud-standard-2
    steps:
      # Only the trusted tracker revision is checked out, never the benchmark's PR head.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test artifact selection
        run: node --test .github/scripts/benchmark-artifact.test.cjs
      - name: Select the successful attempt's artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const select = require('./.github/scripts/benchmark-artifact.cjs');
            const selected = await select({ github, context });
            core.setOutput('run_id', selected.runId);
            core.setOutput('artifact_id', selected.artifactId);
            core.setOutput('head_sha', selected.headSha);
            core.info(`Publishing run ${selected.runId}, attempt ${selected.attempt}, artifact ${selected.artifactId}`);
      - name: Download benchmark results (from step 1)
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          # ID selection is not a single-name download in v4; flatten this one selected artifact.
          merge-multiple: true
          path: benchmark-input

      - name: Extract PR metadata from the saved event
        uses: actions/github-script@v7
        env:
          BENCHMARK_HEAD_SHA: ${{ steps.artifact.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const pr = JSON.parse(fs.readFileSync('benchmark-input/event.json', { encoding: 'utf8' }));
            if (pr.pull_request.head.sha !== process.env.BENCHMARK_HEAD_SHA ||
                pr.pull_request.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Artifact PR metadata does not match the selected benchmark run');
            }
            core.exportVariable('PR_HEAD', pr.pull_request.head.ref);
            core.exportVariable('PR_HEAD_SHA', pr.pull_request.head.sha);
            core.exportVariable('PR_BASE', pr.pull_request.base.ref);
            core.exportVariable('PR_BASE_SHA', pr.pull_request.base.sha);
            core.exportVariable('PR_NUMBER', pr.number);

      - uses: bencherdev/bencher@main

      # Instruction counts (iai-callgrind) — TRACKING ONLY, no `--err`. iai is *mostly*
      # deterministic, but the search path iterates `HashMap`s seeded by `RandomState`, so
      # instruction counts jitter a few percent run-to-run; a 2% `--err` gate (cloned from main's
      # threshold via --start-point-clone-thresholds) red-failed PRs on noise that main's own
      # bench.yml deliberately stopped gating for the same reason (see its "Track instruction
      # counts" comment). Track + alert in Bencher instead of hard-failing the PR check — same
      # "headline signal, not a gate" stance as bench.yml. See #648. Re-arm `--err` once the
      # start-point baseline is current and the query benches are deterministically seeded.
      - name: Track instruction counts (iai-callgrind)
        run: |
          bencher run \
            --branch "$PR_HEAD" \
            --hash "$PR_HEAD_SHA" \
            --start-point "$PR_BASE" \
            --start-point-hash "$PR_BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --adapter rust_iai_callgrind \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --ci-number "$PR_NUMBER" \
            --file benchmark-input/benchmark_results_iai.txt

      # Wall-clock index time (criterion) — noisier, statistical threshold lives on the main branch.
      - name: Track wall-clock index time (criterion)
        run: |
          bencher run \
            --branch "$PR_HEAD" \
            --hash "$PR_HEAD_SHA" \
            --start-point "$PR_BASE" \
            --start-point-hash "$PR_BASE_SHA" \
            --start-point-clone-thresholds \
            --start-point-reset \
            --adapter rust_criterion \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --ci-number "$PR_NUMBER" \
            --err \
            --file benchmark-input/benchmark_results_criterion.txt
