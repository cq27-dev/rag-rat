name: oracle

# Unified, tier-driven SCIP-oracle resolution runner (#164, C3). One workflow over the declarative
# corpus profiles in tools/oracle-corpora.toml, replacing the per-language oracle-rust.yml /
# oracle-kernel.yml demos. tools/oracle-run.sh does the work for one corpus (clone @ rev → prepare →
# index → `rag-rat oracle report`); this workflow just selects the tier and fans out.
#
#   small  — per-PR (and on main): fast corpora on GitHub-hosted runners. The health gate in
#            `oracle report` makes a broken/regressed corpus FAIL the job. The Δ-vs-baseline PR
#            comment is layered on later (tools/oracle-report-md.py, C5); here the report JSON is
#            uploaded as an artifact.
#   heavy  — release / manual dispatch only: the big corpora on the self-hosted big-memory box,
#            pushed to Bencher as the headline resolution series. Never on PRs.

on:
  pull_request:
    paths:
      # oracle runs the `rag-rat` binary (`index --full` + `oracle report`, see tools/oracle-run.sh)
      # over external corpora, so it gates core's parser/resolution AND the cli entry points that
      # drive it. Only the mcp crate can't move it — narrow from crates/** to core + cli (drops mcp).
      - 'crates/rag-rat-base/**'
      - 'crates/rag-rat-db/**'
      - 'crates/rag-rat-papertrail/**'
      - 'crates/rag-rat-core/**'
      - 'crates/rag-rat-cli/**'
      # Root Cargo.toml/Cargo.lock change the built rag-rat binary (workspace deps / pinned
      # versions) without touching crates/** — gate on them too so a dependency bump can't merge
      # parser/oracle behaviour changes past the resolution health gate.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/oracle-corpora.toml'
      - 'tools/oracle-toolchain/**'
      - 'tools/oracle-corpus.py'
      - 'tools/oracle-run.sh'
      - 'tools/oracle-report-bmf.py'
      - 'tools/oracle-report-md.py'
      - '.github/workflows/oracle.yml'
  push:
    branches: [main]
    paths:
      # oracle runs the `rag-rat` binary (`index --full` + `oracle report`, see tools/oracle-run.sh)
      # over external corpora, so it gates core's parser/resolution AND the cli entry points that
      # drive it. Only the mcp crate can't move it — narrow from crates/** to core + cli (drops mcp).
      - 'crates/rag-rat-base/**'
      - 'crates/rag-rat-db/**'
      - 'crates/rag-rat-papertrail/**'
      - 'crates/rag-rat-core/**'
      - 'crates/rag-rat-cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/oracle-corpora.toml'
      - 'tools/oracle-toolchain/**'
      - 'tools/oracle-corpus.py'
      - 'tools/oracle-run.sh'
      - 'tools/oracle-report-bmf.py'
      - 'tools/oracle-report-md.py'
      - '.github/workflows/oracle.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tier:
        description: 'Corpus tier to run (small | heavy)'
        required: false
        default: 'small'

# Least privilege: read the repo only. The heavy job's Bencher upload uses its own API token.
permissions:
  contents: read

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned SCIP toolchain for the small tier so a PR number isn't perturbed by an unrelated indexer
  # release. scip-clang is pinned to an explicit prebuilt version (a single static binary, no
  # transitive tree); rust-analyzer is installed as a rustup component (below), pinning it to the
  # stable toolchain (a ~6-week cadence) instead of the weekly `releases/latest`. The npm-based
  # indexers (scip-typescript, scip-python) are pinned by `tools/oracle-toolchain/package-lock.json`
  # via `npm ci` — their FULL transitive tree (notably scip-typescript's bundled `typescript`
  # compiler) is locked, so a transitive npm release can't shift a PR's numbers while the indexer's
  # own `--version` is unchanged (#185 item 2).
  SCIP_CLANG_VERSION: v0.4.0

jobs:
  matrix:
    # Resolve the tier and emit its corpus ids as a JSON array for the fan-out. release → heavy;
    # dispatch → the chosen input; PR/push → small.
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.select.outputs.tier }}
      corpora: ${{ steps.select.outputs.corpora }}
    steps:
      - uses: actions/checkout@v5
      - id: select
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            release)           tier=heavy ;;
            workflow_dispatch) tier="${{ github.event.inputs.tier }}" ;;
            *)                 tier=small ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          corpora="$(python3 tools/oracle-corpus.py --list-tier "$tier" | jq -R . | jq -cs .)"
          echo "corpora=$corpora" >> "$GITHUB_OUTPUT"
          echo "tier=$tier corpora=$corpora"

  small:
    needs: matrix
    if: needs.matrix.outputs.tier == 'small'
    # 24.04: the pinned scip-clang prebuilt links against a recent GLIBC (see bench.Containerfile).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        corpus: ${{ fromJSON(needs.matrix.outputs.corpora) }}
    steps:
      - uses: actions/checkout@v5
      # Pinned to 1.96.0, not `@stable`: rust-analyzer 1.97's `next_solver` panics generating the
      # ground-truth SCIP for the rust-time corpus ("expected int of size 8, but got size 1") — see
      # #553. 1.96.0 is the last stable whose rust-analyzer emits the fixture SCIP cleanly; revert to
      # `@stable` once a released RA no longer panics. rust-analyzer as a toolchain component still
      # pins the SCIP emitter to a stable release (not the weekly `releases/latest`), so the rust-time
      # leg's numbers don't shift under the PR.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rust-analyzer
      - uses: Swatinem/rust-cache@v2

      - name: Build rag-rat (release, hash embedder — no model download)
        run: cargo build --release --no-default-features --bin rag-rat

      - name: Install the corpus's SCIP tool
        run: |
          set -euo pipefail
          tool="$(python3 tools/oracle-corpus.py --corpus '${{ matrix.corpus }}' --field tool)"
          echo "installing $tool for ${{ matrix.corpus }}"
          case "$tool" in
            rust-analyzer)
              # Already installed as a rustup component (toolchain step). Resolve the proxy from the
              # DEFAULT toolchain the `dtolnay/rust-toolchain` step set — NOT a hardcoded `--toolchain
              # stable`, which would ignore the pin (currently 1.96.0, see the toolchain step) and copy
              # the panicking stable rust-analyzer. Toolchain-agnostic, so the pin's `uses:` version is
              # the single line to change when un-pinning. Copy the proxy to an absolute path on PATH
              # so the oracle's `rust-analyzer scip` probe finds it.
              ra="$(rustup which rust-analyzer)"
              install -m 0755 "$ra" /usr/local/bin/rust-analyzer
              rust-analyzer --version ;;
            scip-clang)
              curl --proto '=https' --tlsv1.2 -sSfL \
                "https://github.com/sourcegraph/scip-clang/releases/download/${SCIP_CLANG_VERSION}/scip-clang-x86_64-linux" \
                -o /usr/local/bin/scip-clang
              chmod +x /usr/local/bin/scip-clang
              scip-clang --version ;;
            scip-python|scip-typescript)
              # Install the pinned npm toolchain from its committed lockfile (full transitive tree,
              # incl. scip-typescript's bundled `typescript`) and put its bin dir on PATH for the
              # oracle's probe. `npm ci` is reproducible; `npm install -g @pkg@ver` was not (#185 #2).
              npm ci --no-audit --no-fund --prefix tools/oracle-toolchain
              echo "$PWD/tools/oracle-toolchain/node_modules/.bin" >> "$GITHUB_PATH"
              # Fold the toolchain lockfile hash into the oracle's tool_version (consumed by
              # `oracle report` via RAG_RAT_ORACLE_TOOL_VERSION_SUFFIX). The npm indexers' --version
              # alone doesn't move when only a transitive dep (e.g. the bundled `typescript`) bumps,
              # so without this a lockfile-only change would stay "comparable" to main and the Δ
              # would mis-attribute the toolchain-output change to rag-rat (#185/#197).
              lock_sha="$(sha256sum tools/oracle-toolchain/package-lock.json | cut -c1-12)"
              echo "RAG_RAT_ORACLE_TOOL_VERSION_SUFFIX=toolchain:$lock_sha" >> "$GITHUB_ENV"
              "$PWD/tools/oracle-toolchain/node_modules/.bin/$tool" --version ;;
            *)
              echo "unknown tool '$tool'" >&2; exit 1 ;;
          esac

      - name: Run the oracle for ${{ matrix.corpus }}
        env:
          CORPUS: ${{ matrix.corpus }}
          RAG_RAT_BIN: target/release/rag-rat
          ORACLE_WORK: ${{ runner.temp }}/oracle-${{ matrix.corpus }}
          REPORT_OUT: ${{ runner.temp }}/${{ matrix.corpus }}-report.json
          RAG_RAT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/oracle-run.sh

      - name: Upload resolution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-report-${{ matrix.corpus }}
          path: ${{ runner.temp }}/${{ matrix.corpus }}-report.json
          if-no-files-found: warn

  report:
    # Aggregate the small-tier corpus reports into one Markdown table: a job summary always, plus —
    # on a PR — an artifact the fork-safe oracle-pr-comment.yml posts as a sticky comment. The Δ
    # column diffs each corpus against `main`'s last reports, cached here (saved on a main push,
    # restored on a PR). rag-rat emits JSON only; the Markdown is `tools/oracle-report-md.py` glue.
    needs: [matrix, small]
    # Run whenever the matrix ran, even if a corpus leg failed its health gate — a failing report is
    # exactly what we want surfaced in the summary/comment.
    if: always() && needs.matrix.outputs.tier == 'small' && needs.small.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all corpus reports
        uses: actions/download-artifact@v4
        with:
          pattern: oracle-report-*
          path: reports
          merge-multiple: true

      # main's last reports, for the Δ column. restore-keys prefix-matches the most recent main save;
      # absent on the first run / a brand-new corpus → the script degrades to absolute-only.
      - name: Restore the main baseline reports
        uses: actions/cache/restore@v4
        with:
          path: baselines
          key: oracle-baseline-${{ github.run_id }}
          restore-keys: oracle-baseline-

      - name: Render the Markdown report → job summary
        # Report/baseline paths are space-free (kebab corpus ids under runner.temp), so unquoted
        # word-splitting is safe and keeps this free of bash-version builtins.
        run: |
          set -euo pipefail
          reports="$(find reports -name '*-report.json' | sort)"
          [ -n "$reports" ] || { echo "no corpus reports found" >&2; exit 1; }
          baselines=""
          [ -d baselines ] && baselines="$(find baselines -name '*-report.json' | sort)" || true
          # shellcheck disable=SC2086
          python3 tools/oracle-report-md.py --reports $reports ${baselines:+--baselines $baselines} \
            > oracle-report.md
          cat oracle-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the PR event (for the fork-safe comment step)
        if: github.event_name == 'pull_request'
        run: cp "$GITHUB_EVENT_PATH" event.json

      - name: Upload the rendered report (consumed by oracle-pr-comment.yml)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-report-md
          path: |
            oracle-report.md
            event.json

      # On a main push these reports become the new baseline future PRs diff against. Immutable
      # per-run key; the PR restore-keys prefix picks the most recent.
      - name: Publish the new main baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf baselines && mkdir baselines && cp reports/*-report.json baselines/
      - name: Save the main baseline cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: baselines
          key: oracle-baseline-${{ github.run_id }}

  heavy:
    needs: matrix
    if: needs.matrix.outputs.tier == 'heavy'
    # Self-hosted big-memory box (same as bench-release): the heavy corpora (whole cargo workspace,
    # a kernel build + scip-clang) want the RAM + disk, and the SCIP tools live in the bench image.
    # Heavy runs on release / dispatch only (never PRs), so a public-repo self-hosted runner is safe.
    runs-on: [self-hosted, bigmem]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Serial: both corpora would contend for the box's RAM if run at once.
      max-parallel: 1
      matrix:
        corpus: ${{ fromJSON(needs.matrix.outputs.corpora) }}
    env:
      BENCHER_PROJECT: rag-rat
      BENCHER_TESTBED: hetzner-bigmem
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # Pinned bench environment: rust-analyzer + scip-clang + kernel-build deps live in the image,
      # so the SCIP indexer versions are reproducible (the content-addressed tool_version). Layer-
      # cached on the runner.
      - name: Build bench image
        run: docker build -t rag-rat-bench -f tools/bench.Containerfile .

      - name: Run the oracle for ${{ matrix.corpus }} and emit its report
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            -v "${{ runner.temp }}":/work \
            -v rag-rat-cargo-registry:/usr/local/cargo/registry \
            -v rag-rat-target:/repo/target \
            -e CORPUS='${{ matrix.corpus }}' \
            -e ORACLE_WORK=/work/oracle-${{ matrix.corpus }} \
            -e REPORT_OUT=/work/${{ matrix.corpus }}-report.json \
            -e RAG_RAT_BIN=/repo/target/release/rag-rat \
            -e RAG_RAT_COMMIT='${{ github.sha }}' \
            rag-rat-bench \
            bash -c 'cargo build --release --no-default-features --bin rag-rat && bash tools/oracle-run.sh'

      - name: Convert the report to BMF
        run: |
          python3 tools/oracle-report-bmf.py \
            "${{ runner.temp }}/${{ matrix.corpus }}-report.json" \
            > "${{ runner.temp }}/${{ matrix.corpus }}-bmf.json"

      - uses: bencherdev/bencher@main

      # No --err: a headline resolution signal, not a gate. A regression shows in the Bencher plots.
      - name: Track ${{ matrix.corpus }} edge resolution (Bencher)
        run: |
          bencher run \
            --branch main \
            --adapter json \
            --file "${{ runner.temp }}/${{ matrix.corpus }}-bmf.json" \
            --project "$BENCHER_PROJECT" \
            --testbed "$BENCHER_TESTBED"

      - name: Upload report + BMF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-heavy-${{ matrix.corpus }}
          path: |
            ${{ runner.temp }}/${{ matrix.corpus }}-report.json
            ${{ runner.temp }}/${{ matrix.corpus }}-bmf.json
          if-no-files-found: warn
