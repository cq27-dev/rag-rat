name: bench

# Continuous benchmarking on main. Tracks two independent signals in Bencher:
#   - rag_pipeline (iai-callgrind): deterministic CPU instruction counts (index + cold/warm query)
#   - index_time  (criterion):     wall-clock full-index time
# Requires a Bencher project named `rag-rat` and the repo secret BENCHER_API_TOKEN holding a Bencher
# *project key* (`bencher_run_…`), surfaced to the CLI as BENCHER_API_KEY (see docs/bencher.md).

on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCHER_PROJECT: rag-rat
  BENCHER_TESTBED: ubuntu-latest
  # The secret holds a Bencher *project key* (`bencher_run_…`), so it goes in BENCHER_API_KEY
  # (the --key auth path), NOT BENCHER_API_TOKEN (which expects an account JWT and rejects a key).
  BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
  # Must match the iai-callgrind library version in Cargo.toml.
  IAI_RUNNER_VERSION: "0.16.1"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind (iai-callgrind)
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Cache iai-callgrind-runner
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/iai-callgrind-runner
          key: iai-runner-${{ env.IAI_RUNNER_VERSION }}
      - name: Install iai-callgrind-runner
        run: command -v iai-callgrind-runner || cargo install --locked iai-callgrind-runner@${{ env.IAI_RUNNER_VERSION }}
      - name: Cache bench corpus (cargo 0.97.1)
        uses: actions/cache@v5
        with:
          path: target/bench-corpus
          key: bench-corpus-cargo-0.97.1
      - uses: bencherdev/bencher@main

      # Instruction counts — TRACKING ONLY, no `--err`. iai is *mostly* deterministic, but the
      # search path iterates `HashMap`s seeded by `RandomState`, so instruction counts jitter a few
      # percent run-to-run; a 2% `--err` gate red-failed every push for weeks (docs-only commits
      # included) against a stale baseline, providing zero signal. Track + alert in Bencher instead
      # of hard-failing the workflow — same "headline signal, not a gate" stance as bench-release.
      # Re-arm `--err` (with a sane boundary above the jitter) once the baseline has stabilised.
      - name: Track instruction counts (iai-callgrind)
        run: |
          bencher run \
            --branch main \
            --adapter rust_iai_callgrind \
            --threshold-measure instructions \
            --threshold-test percentage \
            --threshold-upper-boundary 0.02 \
            --thresholds-reset \
            "cargo bench --no-default-features --bench rag_pipeline"

      # Wall-clock time — statistical threshold (criterion is noisy). Tracking only, same rationale.
      - name: Track wall-clock index time (criterion)
        run: |
          bencher run \
            --branch main \
            --adapter rust_criterion \
            --threshold-measure latency \
            --threshold-test t_test \
            --threshold-upper-boundary 0.95 \
            --thresholds-reset \
            "cargo bench --no-default-features --bench index_time"
