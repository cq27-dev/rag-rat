name: bench

# Continuous benchmarking on main. Tracks two independent signals in Bencher:
#   - rag_pipeline (iai-callgrind): deterministic CPU instruction counts (index + cold/warm query)
#   - index_time  (criterion):     wall-clock full-index time
# Requires a Bencher project named `rag-rat` and the repo secret BENCHER_API_TOKEN holding a Bencher
# *project key* (`bencher_run_…`), surfaced to the CLI as BENCHER_API_KEY (see docs/bencher.md).

on:
  push:
    branches: [main]
  # Manual trigger to REAPPLY the Bencher thresholds (this job runs `bencher run --thresholds-reset`
  # on `main`). Use it when the baseline drifts or thresholds get into a bad state without waiting
  # for the next push to main — PR runs clone `main`'s thresholds via `--start-point-clone-thresholds`.
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCHER_PROJECT: rag-rat
  BENCHER_TESTBED: ubuntu-latest
  # The secret holds a Bencher *project key* (`bencher_run_…`), so it goes in BENCHER_API_KEY
  # (the --key auth path), NOT BENCHER_API_TOKEN (which expects an account JWT and rejects a key).
  BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
  # Must match the iai-callgrind library version in Cargo.toml.
  IAI_RUNNER_VERSION: "0.16.1"

jobs:
  bench:
    runs-on: ubuntu-latest
    # The publish steps below hardcode `--branch main --thresholds-reset`, so this job must only run
    # against main — a manual dispatch from a feature ref would otherwise reset main's baseline with
    # non-main results. The push trigger is already main-only; this guards the workflow_dispatch ref.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind (iai-callgrind)
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Cache iai-callgrind-runner
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/iai-callgrind-runner
          key: iai-runner-${{ env.IAI_RUNNER_VERSION }}
      - name: Install iai-callgrind-runner
        run: command -v iai-callgrind-runner || cargo install --locked iai-callgrind-runner@${{ env.IAI_RUNNER_VERSION }}
      - name: Cache bench corpus (cargo 0.97.1)
        uses: actions/cache@v5
        with:
          path: target/bench-corpus
          key: bench-corpus-cargo-0.97.1
      - uses: bencherdev/bencher@main

      # Instruction counts — TRACKING ONLY, no `--err`. iai is *mostly* deterministic, but the
      # search path iterates `HashMap`s seeded by `RandomState`, so instruction counts jitter a few
      # percent run-to-run; a 2% `--err` gate red-failed every push for weeks (docs-only commits
      # included) against a stale baseline, providing zero signal. Track + alert in Bencher instead
      # of hard-failing the workflow — same "headline signal, not a gate" stance as bench-release.
      # Re-arm `--err` (with a sane boundary above the jitter) once the baseline has stabilised.
      - name: Track instruction counts (iai-callgrind)
        run: |
          bencher run \
            --branch main \
            --adapter rust_iai_callgrind \
            --threshold-measure instructions \
            --threshold-test percentage \
            --threshold-upper-boundary 0.02 \
            --thresholds-reset \
            "cargo bench --no-default-features --bench rag_pipeline"

      # Wall-clock time — statistical threshold (criterion is noisy). Tracking only, same rationale.
      - name: Track wall-clock index time (criterion)
        run: |
          bencher run \
            --branch main \
            --adapter rust_criterion \
            --threshold-measure latency \
            --threshold-test t_test \
            --threshold-upper-boundary 0.95 \
            --thresholds-reset \
            "cargo bench --no-default-features --bench index_time"

  # Search-quality headline (#19): commit-replay recall over the self-index at HEAD, tracked in
  # Bencher. recall@3 is the metric an agent actually feels — "did the right chunk land in the first
  # 3 reads". The 200-case replay is ~8-10 min, so it lives HERE on main (post-merge), never on the
  # PR path: it would be both too slow to gate and too noisy to gate (the replay gold is each
  # commit's changed paths, so a single PR's recall delta is usually below the per-case noise floor).
  # Tracking only, NO `--err` — a real regression ALERTS via the statistical lower boundary on
  # recall@3; a noisy dip doesn't hard-fail the run. Same stance as the iai/criterion series above.
  eval_recall:
    name: search recall (commit-replay)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      # Stable, cacheable location for the MiniLM ONNX download (fastembed honours this env var;
      # mirrors eval.yml). The model is immutable, so the cache key is static.
      RAG_RAT_MODEL_CACHE: ${{ github.workspace }}/.rag-rat-models
    steps:
      - uses: actions/checkout@v5
        # FULL history: the commit-replay derives its cases from git history (commit message = query,
        # changed paths = recall gold), so the default depth-1 shallow checkout would leave it with
        # only HEAD and zero cases. fetch-depth: 0 fetches every commit for `index` to ingest.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache embedding model (MiniLM)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.rag-rat-models
          key: rag-rat-models-minilm-v1
      - uses: bencherdev/bencher@main

      - name: Build the eval-feature binary
        run: cargo build --release -p rag-rat --features eval --locked

      # Build + embed the index AT HEAD. The replay scores commit-message queries against the hybrid
      # (lexical + semantic) path, so the chunks must be embedded — and reconcile only embeds at-head
      # chunks, so a fresh checkout must index -> install the model -> reconcile first. The off-head
      # footgun: a stale/absent index makes EVERY recall read a bogus 0.000.
      - name: Index + embed at HEAD
        run: |
          ./target/release/rag-rat index --discover
          ./target/release/rag-rat models install fastembed-all-minilm-l6-v2
          ./target/release/rag-rat reconcile

      - name: Run commit-replay eval -> JSON -> BMF
        run: |
          ./target/release/rag-rat --json eval --replay --replay-max-cases 200 > eval.json
          python3 tools/eval-report-bmf.py eval.json > eval_bmf.json
          cat eval_bmf.json

      # recall@3 carries the statistical lower-boundary threshold; recall@10 + mrr@10 are tracked
      # without one (`--thresholds-reset` clears any boundary not re-set here). No `--err`.
      - name: Track search recall (Bencher)
        run: |
          bencher run \
            --branch main \
            --adapter json \
            --file eval_bmf.json \
            --threshold-measure recall_at_3 \
            --threshold-test t_test \
            --threshold-lower-boundary 0.95 \
            --thresholds-reset

      - name: Upload eval report + BMF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-recall
          path: |
            eval.json
            eval_bmf.json
          if-no-files-found: warn
