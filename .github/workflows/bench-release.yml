name: bench-release

# Heavyweight indexing benchmarks that only make sense to run occasionally — specifically the
# headline "index the whole Linux kernel in X seconds" number. A full kernel index is ~tens of
# minutes, so this can't run per-push (that's what the lightweight criterion/iai benches in
# bench.yml are for); it runs on a published release (and on manual dispatch, to validate the
# number before trusting it on a release). Results go to Bencher via the generic JSON adapter.
# See docs/bencher.md and tools/bench-kernel.sh.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      kernel_subdirs:
        description: 'Kernel subtrees to index (space-separated; "." = whole tree)'
        required: false
        default: '.'
      wave_size:
        description: 'Full-rebuild wave size (RAG_RAT_INDEX_WAVE) — the memory/speed knob (default 2000)'
        required: false
        default: '2000'
      mem_trace:
        description: 'Set to 1 to emit per-phase MEMTRACE (RSS + sqlite_memory) to the log for peak diagnosis'
        required: false
        default: ''
      soft_heap_limit_mb:
        description: 'Cap SQLite soft heap (MB) for the run — tests if a SQLite spike is discretionary buffering vs load-bearing'
        required: false
        default: ''
      wal_autocheckpoint:
        description: 'Override wal_autocheckpoint (pages) during rebuild; 0 disables the COMMIT-time checkpoint (peak ablation)'
        required: false
        default: ''

permissions:
  contents: read
  checks: write

env:
  BENCHER_PROJECT: rag-rat
  # Distinct testbed: this runs on a self-hosted big-memory box, not a GitHub runner, so its numbers
  # are tracked separately from the bounded GitHub-hosted runs.
  BENCHER_TESTBED: hetzner-bigmem
  # Project key (`bencher_run_…`) → --key auth path (see bench.yml / docs/bencher.md).
  BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
  KERNEL_TAG: v7.0

jobs:
  kernel:
    # Self-hosted runner (62 GB RAM): the whole-kernel index peaks at ~5.5 GiB RSS (the embedding
    # reconcile; see docs/benchmarks.md) plus the OS page cache over a ~10 GB index DB — runnable on
    # a hosted box but with a noisy, contended wall-clock, which defeats the point of a headline
    # number. Only the release / workflow_dispatch triggers land here (never PRs), so a public-repo
    # self-hosted runner is safe. See docs/bencher.md.
    runs-on: [self-hosted, bigmem]
    # A whole-kernel index is long but bounded; cap it so a pathological run can't hang for hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # Pinned bench environment (#71): the Rust toolchain + deps live in the image, so the kernel
      # index runs against a reproducible toolchain rather than the drifting host. Layer-cached.
      - name: Build bench image
        run: docker build -t rag-rat-bench -f tools/bench.Containerfile .

      - name: Index the Linux kernel and emit BMF
        env:
          RAG_RAT_KERNEL_SUBDIRS: ${{ github.event.inputs.kernel_subdirs || '.' }}
          RAG_RAT_INDEX_WAVE: ${{ github.event.inputs.wave_size || '2000' }}
          RAG_RAT_MEM_TRACE: ${{ github.event.inputs.mem_trace }}
          RAG_RAT_SQLITE_SOFT_HEAP_LIMIT_MB: ${{ github.event.inputs.soft_heap_limit_mb }}
          RAG_RAT_WAL_AUTOCHECKPOINT: ${{ github.event.inputs.wal_autocheckpoint }}
        # Repo at /repo (BMF lands on the host); runner.temp at /work keeps the multi-GB checkout +
        # ~10 GB index DB on real disk, not the container overlay (and off the box's RAM-backed
        # /tmp). Named volumes cache cargo + target. RSS/maxrss are measured inside the container
        # (same PID namespace as rag-rat), so the memory numbers are unaffected.
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            -v "${{ runner.temp }}":/work \
            -v rag-rat-cargo-registry:/usr/local/cargo/registry \
            -v rag-rat-target:/repo/target \
            -e RAG_RAT_KERNEL_SUBDIRS="$RAG_RAT_KERNEL_SUBDIRS" \
            -e RAG_RAT_INDEX_WAVE="$RAG_RAT_INDEX_WAVE" \
            -e RAG_RAT_MEM_TRACE="$RAG_RAT_MEM_TRACE" \
            -e RAG_RAT_SQLITE_SOFT_HEAP_LIMIT_MB="$RAG_RAT_SQLITE_SOFT_HEAP_LIMIT_MB" \
            -e RAG_RAT_WAL_AUTOCHECKPOINT="$RAG_RAT_WAL_AUTOCHECKPOINT" \
            -e BMF_OUT=/work/kernel_bmf.json \
            -e RSS_CSV=/work/kernel_rss_samples.csv \
            -e TAXONOMY_CSV=/work/kernel_unresolved_by_kind.csv \
            -e KERNEL_WORK=/work/kbench-${{ github.run_id }} \
            -e RAG_RAT_BIN=/repo/target/release/rag-rat \
            rag-rat-bench \
            bash -c 'cargo build --release --no-default-features --bin rag-rat && bash tools/bench-kernel.sh'

      - uses: bencherdev/bencher@main

      # Track latency / throughput / memory over releases. No --err: a slow kernel index must not
      # fail a release publish; this is a headline signal, not a gate.
      - name: Track kernel index (Bencher)
        run: |
          bencher run \
            --branch main \
            --adapter json \
            --file "${{ runner.temp }}/kernel_bmf.json"

      - name: Upload BMF + RSS time-series artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel_bmf
          path: |
            ${{ runner.temp }}/kernel_bmf.json
            ${{ runner.temp }}/kernel_rss_samples.csv
            ${{ runner.temp }}/kernel_unresolved_by_kind.csv
