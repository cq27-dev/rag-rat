name: oracle-kernel

# Repeatable C edge-resolution demo: build the Linux kernel, run the scip-clang oracle over the
# compiled subset, and record the heuristic-vs-compiler resolution delta in Bencher (#71, feeds the
# #73 resolved-rate taxonomy). Heavyweight (kernel build + scip-clang), so dispatch-only — never
# per-push. See tools/kernel-c-oracle.sh and docs/bencher.md.

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: 'make config target for compile_commands.json — defconfig (fast, partial coverage) or allmodconfig (fuller, hours)'
        required: false
        default: 'defconfig'

permissions:
  contents: read
  checks: write

env:
  BENCHER_PROJECT: rag-rat
  BENCHER_TESTBED: hetzner-bigmem
  BENCHER_API_KEY: ${{ secrets.BENCHER_API_TOKEN }}
  KERNEL_TAG: v7.0

jobs:
  c-oracle:
    # Same self-hosted big-memory box as bench-release: the whole-kernel index + a kernel build +
    # scip-clang need the RAM and disk, and scip-clang is installed there. Dispatch-only (never
    # PRs), so a public-repo self-hosted runner is safe.
    runs-on: [self-hosted, bigmem]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      # Pinned bench environment (#71): scip-clang, rust-analyzer, the kernel-build deps (bc/…),
      # and the Rust toolchain all live in the image, so a missing host package (the `bc` failure)
      # can't recur and the SCIP indexer versions are reproducible. Layer-cached on the runner.
      - name: Build bench image
        run: docker build -t rag-rat-bench -f tools/bench.Containerfile .

      - name: Run the scip-clang oracle over the kernel and emit BMF
        env:
          KERNEL_CONFIG: ${{ github.event.inputs.kernel_config || 'defconfig' }}
        # Mount the checkout at /repo (BMF lands here, on the host) and runner.temp at /work (the
        # multi-GB kernel checkout + index DB stay on real disk, not the container overlay). Named
        # volumes cache cargo + target across runs. rag-rat is built inside the image's pinned
        # toolchain, then the script runs.
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            -v "${{ runner.temp }}":/work \
            -v rag-rat-cargo-registry:/usr/local/cargo/registry \
            -v rag-rat-target:/repo/target \
            -e KERNEL_CONFIG="$KERNEL_CONFIG" \
            -e BMF_OUT=/work/kernel_c_oracle_bmf.json \
            -e KERNEL_WORK=/work/coracle-${{ github.run_id }} \
            -e RAG_RAT_BIN=/repo/target/release/rag-rat \
            rag-rat-bench \
            bash -c 'cargo build --release --no-default-features --bin rag-rat && bash tools/kernel-c-oracle.sh'

      - uses: bencherdev/bencher@main

      # No --err: this is a headline resolution signal, not a gate. A regression shows in the plots.
      - name: Track C edge resolution (Bencher)
        run: |
          bencher run \
            --branch main \
            --adapter json \
            --file "${{ runner.temp }}/kernel_c_oracle_bmf.json" \
            --project "$BENCHER_PROJECT" \
            --testbed "$BENCHER_TESTBED"

      - name: Upload oracle report + BMF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-c-oracle
          path: |
            ${{ runner.temp }}/kernel_c_oracle_bmf.json
            ${{ runner.temp }}/coracle-${{ github.run_id }}/oracle-report.json
