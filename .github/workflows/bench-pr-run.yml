name: bench-pr-run

# Fork-safe step 1 of 2: runs benchmarks on a PR (forks included) with NO secrets, then uploads the
# raw results + PR event as an artifact. The upload to Bencher (which needs the token) happens in
# bench-pr-track.yml, triggered by this workflow completing — so a fork PR can never read the token.
# Pattern mirrors Bencher's "Track Benchmarks with GitHub Actions" (fork PRs) docs.

on:
  # The criterion + iai benches live in crates/rag-rat-core/benches and exercise only core's
  # index/query/clone paths — cli/mcp/docs changes can't move the numbers, so they skip (and the
  # paired bench-pr-track tracker, gated on this workflow_run, then skips too).
  pull_request:
    types: [opened, reopened, edited, synchronize]
    paths:
      - 'crates/rag-rat-base/**'
      - 'crates/rag-rat-clones/**'
      - 'crates/rag-rat-db/**'
      - 'crates/rag-rat-dream/**'
      - 'crates/rag-rat-llm/**'
      - 'crates/rag-rat-oracle/**'
      - 'crates/rag-rat-oplog/**'
      - 'crates/rag-rat-query/**'
      - 'crates/rag-rat-papertrail/**'
      - 'crates/rag-rat-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench-pr-run.yml'

# Fork-safe by construction: no secrets are used here, and the token is read-only.
#
# Benchmarks run on the self-hosted `bigmem` runner: ONE runner, one slot, so every benchmark of the
# repository (this, `bench` on main, `bench-release`, the heavy oracle tier) runs one at a time by
# construction, never beside another. A fork's pull request is untrusted code that may not run
# there, and no hosted baseline is kept for it to compare against, so it skips the benchmark; its
# tracker run (`bench-pr-track`, gated on this one succeeding) skips with it.
permissions:
  contents: read

# A push supersedes the run in flight: bench-pr-track reads only a `success` run, so a cancelled one
# tracks nothing and the runner minutes go to the commit that will actually be reviewed.
concurrency:
  group: bench-pr-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # The release PR (`release-plz-*`) changes versions, the changelog and the plugin manifests —
    # nothing this workflow measures — and its branch is rewritten on every push to main, so
    # running here would only restart a long job that a merge cancels again.
    if: ${{ !startsWith(github.head_ref, 'release-plz-') && !github.event.pull_request.head.repo.fork }}
    runs-on: bigmem
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The runner is persistent: the iai runner stays installed in its cargo home, and the bench
      # corpus in the directory its `RAG_RAT_BENCH_CORPUS` names, so neither needs a cache step.
      - name: Install iai-callgrind-runner
        run: command -v iai-callgrind-runner || cargo install --locked iai-callgrind-runner@0.16.1

      - name: Run benchmarks (save raw output; no gating here)
        # Capture stdout only — the adapters parse the benchmark report from stdout; cargo/valgrind
        # progress goes to stderr and would corrupt the results files Bencher reads in step 2.
        run: |
          cargo bench --no-default-features --bench rag_pipeline > benchmark_results_iai.txt
          cargo bench --no-default-features --bench index_time  > benchmark_results_criterion.txt

      - name: Save PR event metadata (for the PR comment in step 2)
        run: cp "$GITHUB_EVENT_PATH" event.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark_results
          path: |
            benchmark_results_iai.txt
            benchmark_results_criterion.txt
            event.json
