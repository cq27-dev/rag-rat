name: runner-maintenance

# Housekeeping for the persistent self-hosted runners. Each keeps a cargo target dir outside its
# checkout so builds stay warm between jobs, and every feature set and profile CI builds leaves its
# own artifacts there, while old dependency versions are never removed — left alone, the dirs grew
# by ~50 GB a day. This caps each one by evicting the oldest artifacts (a warm build touches what it
# uses, so what goes is what nothing has needed for longest) and prunes dangling Docker layers left
# by bench image rebuilds. Runs on any `ci` runner: they share one home, so one job reaches every
# runner's dir. Age-based sweeping does not work here — a busy day touches everything.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cap every runner's cargo target dir
        run: |
          set -euo pipefail
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          command -v cargo-sweep >/dev/null || cargo install --locked cargo-sweep
          # cargo-sweep reads the target dir through `cargo metadata` of a checkout; this one serves
          # for every dir, since they were all built from this workspace.
          # cargo-sweep removes files without taking Cargo's build-directory lock, and a sibling
          # runner may be mid-build in the dir being swept. Hold every profile's `.cargo-lock` for the
          # sweep (the lock Cargo blocks on), so a build in progress finishes first and one starting
          # waits; the coverage dir's cycle-wide lock is held the same way.
          sweep() {
            local dir=$1; shift
            local locks=()
            for lock in "$dir"/*/.cargo-lock "$dir"/*/*/.cargo-lock; do
              [ -e "$lock" ] && locks+=("$lock")
            done
            if [ ${#locks[@]} -eq 0 ]; then CARGO_TARGET_DIR="$dir" cargo sweep --maxsize 30GB; return; fi
            local cmd=(env "CARGO_TARGET_DIR=$dir" cargo sweep --maxsize 30GB)
            for lock in "${locks[@]}"; do cmd=(flock "$lock" "${cmd[@]}"); done
            "${cmd[@]}"
          }
          # Cargo's lock covers compilation only: nextest and the benches run their binaries after
          # it is released, and an eviction then can take a binary a sibling's test phase still
          # needs. So sibling dirs are swept only while this job is the sole runner worker on the
          # box — a job starting afterwards compiles first, behind the locks above, before it runs
          # anything. This runner's own dir is idle by construction and is always swept.
          own="${CARGO_TARGET_DIR:-}"
          siblings_idle() { [ "$(pgrep -c -f 'Runner.Worker')" -le 1 ]; }
          for _ in $(seq 1 60); do siblings_idle && break; sleep 30; done
          for dir in "$HOME"/actions-runner*/cargo-target; do
            [ -d "$dir" ] || continue
            if [ "$dir" != "$own" ] && ! siblings_idle; then
              echo "== $dir: skipped, a sibling runner is busy"
              continue
            fi
            echo "== $dir: $(du -sh "$dir" | cut -f1) before"
            sweep "$dir"
            echo "== $dir: $(du -sh "$dir" | cut -f1) after"
          done
          if [ -d "$HOME/cargo-target-coverage" ]; then
            echo "== coverage: $(du -sh "$HOME/cargo-target-coverage" | cut -f1) before"
            flock "$HOME/cargo-target-coverage.lock" env CARGO_TARGET_DIR="$HOME/cargo-target-coverage" cargo sweep --maxsize 30GB
            echo "== coverage: $(du -sh "$HOME/cargo-target-coverage" | cut -f1) after"
          fi
      - name: Prune dangling Docker layers
        run: docker image prune -f
      - name: Report
        run: df -h /
