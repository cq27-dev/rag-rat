[workspace]
members = [
  "crates/rag-rat-base",
  "crates/rag-rat-clones",
  "crates/rag-rat-db",
  "crates/rag-rat-dream",
  "crates/rag-rat-llm",
  "crates/rag-rat-oracle",
  "crates/rag-rat-oplog",
  "crates/rag-rat-papertrail",
  "crates/rag-rat-query",
  "crates/rag-rat-cli",
  "crates/rag-rat-core",
  "crates/rag-rat-mcp",
]
resolver = "3"

[workspace.package]
# Single source of truth for the crate version — every member sets `version.workspace = true`,
# and the internal path deps below pin the same literal, so the three crates always publish in
# lockstep. Bump this one line (and the two internal-dep `version`s under workspace.dependencies)
# to release.
version = "0.20.0"
authors = ["Kristaps Karlsons"]
edition = "2024"
# Bundled SQLite (rusqlite `bundled` -> libsqlite3-sys 0.38.1) compiles a build script that uses the
# `cfg_select!` macro, stabilized in Rust 1.95 — so the whole workspace's MSRV is 1.95 on every
# platform. (Latest non-SQLite deps need only 1.88: darling, ort-sys.)
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/cq27-dev/rag-rat"
readme = "README.md"
keywords = ["rag", "mcp", "code-search", "tree-sitter", "scip"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Internal crates — declared once here so the version requirement is set in lockstep with
# [workspace.package].version above. Members reference these via `{ workspace = true }` and add
# their own feature toggles at the use site.
rag-rat-base = { version = "0.20.0", path = "crates/rag-rat-base", default-features = false }
rag-rat-clones = { version = "0.20.0", path = "crates/rag-rat-clones", default-features = false }
rag-rat-db = { version = "0.20.0", path = "crates/rag-rat-db", default-features = false }
rag-rat-dream = { version = "0.20.0", path = "crates/rag-rat-dream", default-features = false }
rag-rat-llm = { version = "0.20.0", path = "crates/rag-rat-llm", default-features = false }
rag-rat-oracle = { version = "0.20.0", path = "crates/rag-rat-oracle", default-features = false }
rag-rat-oplog = { version = "0.20.0", path = "crates/rag-rat-oplog", default-features = false }
rag-rat-papertrail = { version = "0.20.0", path = "crates/rag-rat-papertrail", default-features = false }
rag-rat-query = { version = "0.20.0", path = "crates/rag-rat-query", default-features = false }
rag-rat-core = { version = "0.20.0", path = "crates/rag-rat-core", default-features = false }
rag-rat-mcp = { version = "0.20.0", path = "crates/rag-rat-mcp", default-features = false }
anyhow = "1.0"
# ed25519 device-identity signing for the op-log's signed entry envelope (§C4 layer-1). Default
# features (incl. `zeroize`, which zeroizes a `SigningKey`'s seed on drop) are kept; the `rand_core`
# CSPRNG-keygen feature stays OFF — device keys derive deterministically from a seed via
# `SigningKey::from_bytes`. Verification uses `verify_strict` (rejects malleable / small-order sigs).
ed25519-dalek = "3"
# X25519 device ENCRYPTION keypair beside the ed25519 signing key (sync phase C, §5). Shares
# curve25519-dalek 5 with ed25519-dalek 3 (no second curve impl in the tree). `static_secrets`
# enables the persistable `StaticSecret`, reconstructed from the stored 32-byte secret exactly as the
# ed25519 key is rebuilt from its seed; the default `zeroize` scrubs it on drop. C1 only mints,
# persists, and validates the key (rejecting small-order / identity public keys); ECDH + HKDF is C4.
x25519-dalek = { version = "3", features = ["static_secrets"] }
# XChaCha20-Poly1305 AEAD for content-key wrapping (sync phase C4, #607). Wraps the audited RustCrypto
# stream/MAC primitives (`chacha20`, `poly1305`) — constant-time (`subtle`) tag comparison and
# zeroize-on-drop of the cipher key. `default-features = false` drops the `getrandom`/`rand_core` nonce
# samplers (the wrap nonce is HKDF-derived, never sampled); `alloc` is the `Aead::encrypt` /
# in-place-decrypt surface, and `zeroize` is re-added EXPLICITLY (it is off under
# `default-features = false`) so the cipher's internal copy of the derived wrap key is scrubbed on
# drop — the secret-hygiene invariant the module relies on.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# HKDF-SHA256 for the key-wrap KDF (wrap key + nonce) and the content-key id. Rides the digest-0.11
# line that rag-rat-core's own SHA-256 (`sha2` 0.11, used by oplog::cbor + oplog::device) already
# links, so it adds NO second sha2/digest stack — `Hkdf::<sha2::Sha256>` reuses the existing hash.
hkdf = "0.13"
fastembed = { version = "5.17.3", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
# Cross-platform mtime setter, used only by `test_scratch`'s sweep test to age a fixture dir past
# the sweep threshold (already in the tree transitively; a dev-dependency, not shipped).
filetime = "0.2"
# `join_all` drives the per-binding mirror jobs concurrently on the papertrail
# current-thread runtime (reqwest already pulls futures-util transitively).
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# OS CSPRNG for the op-log device key: fills a 32-byte ed25519 seed at first use, which then flows
# through the existing deterministic `SigningKey::from_bytes`. The lowest-level entropy source (no
# `rand`/`rand_core` pulled in for this), keeping `from_seed` the sole key constructor.
getrandom = "0.4"
gix = { version = "0.85.0", default-features = false, features = ["status", "parallel", "sha1", "sha256", "revision", "blob-diff", "blame"] }
httpdate = "1.0"
libc = "0.2"
# Separator-aware path→forward-slash conversion. Unlike a raw `\`→`/` replace, it only rewrites the
# actual path SEPARATOR — so a literal backslash in a Unix filename is preserved. Used where a path
# becomes a string for a non-filesystem consumer (a `node`/`npx` command arg, a TOML value).
path-slash = "0.2"
# CommonMark parser for distill unit segmentation (#703): `OffsetIter` yields each event with its
# source byte range, so comment/body text splits into quotable units whose byte spans stay exact for
# mechanical quote materialization. `default-features = false` drops the unused HTML renderer; only
# the pull parser + `Options` are used. No `getrandom`/`simd` features.
pulldown-cmark = { version = "0.13", default-features = false }
# Async HTTP for the papertrail provider clients (#589). rustls (no system OpenSSL), no default
# features. Reqwest 0.13's `rustls` feature uses platform trust roots, so enterprise forge CAs work
# when installed in the OS store; minimal Linux images must include a CA bundle. The transport is
# driven on the papertrail module's private runtime at the sync boundary.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "2.2.0", features = ["transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rayon = "1.12"
regex = "1.12"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# Sourcegraph SCIP protobuf types for the SCIP-oracle pass (#61/#68). Normal dependency — the
# size budget is explicitly waived for SCIP; do NOT feature-gate or hand-copy the proto.
# `protobuf` is scip's own transitive dep, pulled in directly so we can call `Message::parse_*`
# on the generated SCIP types; pinned to the version scip 0.9 generates against.
minicbor = { version = "2.2.2", features = ["alloc"] }
protobuf = "=3.7.2"
scip = "0.9.0"
unicode-normalization = "0.1.25"
# On-demand stack growth for the tree-sitter descent helpers. A hostile source file (a callee that
# is thousands of nested parens, a thousands-deep generic type) parses within budget but recursing
# its subtree to find a name/identifier would overflow the indexer's worker-thread stack; `stacker`
# grows the stack instead of crashing (the same mechanism rustc uses). See index::grow_stack (#543).
stacker = "0.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0"
# `time` backs the papertrail transport's rate-limit backoff sleeps (tokio::time::sleep).
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-std", "time"] }
# Minimal blocking HTTP for the crates.io version check. rustls (no system OpenSSL); gzip off —
# the responses are tiny. Tracker REST traffic lives on `reqwest` (papertrail transport, #589).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# TOON (Token-Oriented Object Notation): the default render for CLI + MCP output. ~34% fewer tokens
# than compact JSON on uniform-row payloads, neutral on nested ones — see rag_rat_core::output.
# default-features = false drops its `cli` feature (ratatui/crossterm/arboard/syntect/tiktoken-rs/…)
# — we only need the library encode/decode surface.
tempfile = "3"
toon-format = { version = "0.5.0", default-features = false }
toml = "1.1"
# Structured debug logging (config-gated `[log]`; off by default). Native-only crate, so the
# thread/file-based appender is unrestricted. See rag-rat-core/src/logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "registry"] }
tracing-appender = "0.2"
# Grammar crates are exact-pinned so parser node coverage changes deliberately.
tree-sitter = "=0.26.9"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-kotlin = { package = "tree-sitter-kotlin-ng", version = "1.1.0" }
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-swift = "=0.7.3"
tree-sitter-typescript = "=0.23.2"
# Secret-material hygiene for the op-log device seed — `Zeroizing<[u8; 32]>` scrubs the seed copy on
# drop (already in the tree transitively via ed25519-dalek; pinned here as a direct dep).
zeroize = "1"

# `cc` compiles the bundled SQLite amalgamation at the profile's opt-level, which is 0 for
# `cargo build`/`cargo test` — an unoptimized SQLite is dramatically slower at the heavy INSERT
# workload the indexing tests run. Build just this one C-heavy dep at opt-level 3 so dev/test stays
# fast; it's compiled once then cached.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
