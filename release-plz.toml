# release-plz: automates version bumps, changelog, crates.io publish, and the GitHub release for
# this workspace. https://release-plz.dev/docs/config
#
# Lockstep is the contract: every crate shares one version (see `[workspace.package].version`
# in Cargo.toml). `version_group` below makes release-plz assign the SAME next version to every
# member (the highest bump required across the group), so they never drift. A new crate MUST be
# added here with `version_group = "rag-rat"`, or release-plz treats it as its own group and tries
# to publish it at the current (already-taken) workspace version.

[workspace]
# One git tag + one GitHub release per bump, not one per crate. The libraries stay tag/release-
# silent; the `rag-rat` binary below re-enables both and anchors the single workspace tag.
git_tag_enable = false
git_release_enable = false
# Conventional-commit changelog. `changelog_path` can only be set per-package (below), so all three
# members point at the same root CHANGELOG.md to produce one combined history.
changelog_update = true

# `rag-rat` is the user-facing binary and the natural anchor for the workspace tag. Because every
# release shares one version (version_group), this crate bumps on every release, so it always emits
# exactly one `vX.Y.Z` tag covering the whole workspace.
#
# The GitHub *release* is created by cargo-dist (`dist`), NOT release-plz: `git_release_enable =
# false` hands it off. release-plz still cuts the `vX.Y.Z` tag (git_tag_enable = true); that tag push
# triggers `.github/workflows/release.yml`, which builds the prebuilt binaries + npm installer and
# creates/publishes the GitHub release with the changelog. Do not re-enable git_release_enable here
# or the two tools will race to create the same release.
[[package]]
name = "rag-rat"
version_group = "rag-rat"
git_tag_enable = true
git_release_enable = false
git_tag_name = "v{{ version }}"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-core"
version_group = "rag-rat"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-mcp"
version_group = "rag-rat"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-base"
version_group = "rag-rat"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-db"
version_group = "rag-rat"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-papertrail"
version_group = "rag-rat"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-llm"
version_group = "rag-rat"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-oracle"
version_group = "rag-rat"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-query"
version_group = "rag-rat"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-dream"
version_group = "rag-rat"
changelog_path = "./CHANGELOG.md"

[[package]]
name = "rag-rat-clones"
