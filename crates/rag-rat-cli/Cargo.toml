[package]
name = "rag-rat"
version.workspace = true
description = "CLI and MCP entrypoint for indexing repositories into local source, graph, history, and memory evidence."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "rag-rat"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
gix.workspace = true
rag-rat-core = { workspace = true }
rag-rat-mcp = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Consumed only by the unix-gated terminal-reset guard (`init/mod.rs`) — dead on non-unix targets,
# so gate it there to match rag-rat-core / rag-rat-mcp (#240).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Idle-RSS fix: glibc malloc never returns freed pages to the OS, so a long-lived `rag-rat mcp`
# server retains its peak RSS (~625 MB observed) after the watcher's heavy index/graph passes.
# jemalloc + a background purge thread gives dirty/muzzy pages back shortly after they go idle.
# Gated off msvc (jemalloc has no msvc support); the `#[global_allocator]` cfg matches.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
tikv-jemalloc-ctl = "0.6"

[dev-dependencies]
# MCP tool results render as TOON; integration tests decode them back to JSON Values to assert.
toon-format.workspace = true

[features]
default = ["fastembed", "model2vec"]
fastembed = ["rag-rat-core/fastembed", "rag-rat-mcp/fastembed"]
model2vec = ["rag-rat-core/model2vec", "rag-rat-mcp/model2vec"]
# The `rag-rat eval` subcommand (search-quality + oracle precision/recall gate). OFF by default so
# the shipped binary omits it; CI builds `--features eval` to run the gate.
eval = ["rag-rat-core/eval"]
