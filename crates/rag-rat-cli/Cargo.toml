[package]
name = "rag-rat"
version.workspace = true
description = "CLI and MCP entrypoint for indexing repositories into local source, graph, history, and memory evidence."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "rag-rat"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.12"
libc.workspace = true
rag-rat-core = { workspace = true }
rag-rat-mcp = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# MCP tool results render as TOON; integration tests decode them back to JSON Values to assert.
toon-format.workspace = true

[features]
default = ["fastembed", "model2vec"]
fastembed = ["rag-rat-core/fastembed", "rag-rat-mcp/fastembed"]
model2vec = ["rag-rat-core/model2vec", "rag-rat-mcp/model2vec"]
# The `rag-rat eval` subcommand (search-quality + oracle precision/recall gate). OFF by default so
# the shipped binary omits it; CI builds `--features eval` to run the gate.
eval = ["rag-rat-core/eval"]
