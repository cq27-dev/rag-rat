[package]
name = "rag-rat"
version.workspace = true
description = "CLI and MCP entrypoint for indexing repositories into local source, graph, history, and memory evidence."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "rag-rat"
path = "src/main.rs"

[dependencies]
rag-rat-base.workspace = true
rag-rat-db.workspace = true
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tui-tree-widget = "0.24"
toml_edit = "0.22"
gix.workspace = true
rag-rat-core = { workspace = true }
rag-rat-mcp = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# Consumed only by the unix-gated terminal-reset guard (`init/mod.rs`) — dead on non-unix targets,
# so gate it there to match rag-rat-core / rag-rat-mcp (#240).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Idle-RSS fix: glibc malloc never returns freed pages to the OS, so a long-lived `rag-rat mcp`
# server retains its peak RSS (~625 MB observed) after the watcher's heavy index/graph passes.
# jemalloc + a background purge thread gives dirty/muzzy pages back shortly after they go idle.
# Gated off msvc (jemalloc has no msvc support) and android (the NDK dropped libgcc in r23+, but
# tikv-jemalloc-sys's link line still references `-lgcc` → an `unable to find -lgcc` link failure;
# Android isn't the long-lived-server idle-RSS case, so the system allocator is the right fallback).
# The `#[global_allocator]` cfg in main.rs matches this exactly.
[target.'cfg(all(not(target_env = "msvc"), not(target_os = "android")))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
tikv-jemalloc-ctl = "0.6"

[dev-dependencies]
# MCP tool results render as TOON; integration tests decode them back to JSON Values to assert.
toon-format.workspace = true
tempfile.workspace = true
# The consolidate integration tests assert sibling-repo repo_meta state directly in the global DB.
rusqlite.workspace = true
# Test helpers embed a temp path into a TOML value; path-slash makes it TOML-safe cross-platform.
path-slash.workspace = true

[features]
default = ["fastembed", "model2vec"]
fastembed = ["rag-rat-core/fastembed", "rag-rat-mcp/fastembed"]
model2vec = ["rag-rat-core/model2vec", "rag-rat-mcp/model2vec"]
# The `rag-rat eval` subcommand (search-quality + oracle precision/recall gate). OFF by default so
# the shipped binary omits it; CI builds `--features eval` to run the gate.
eval = ["rag-rat-core/eval"]
