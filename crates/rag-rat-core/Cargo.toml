[package]
name = "rag-rat-core"
version.workspace = true
description = "Repository evidence engine for source chunks, symbols, graph edges, Git history, GitHub rationale, and source-bound memories."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
fastembed = { workspace = true, optional = true }
gix.workspace = true
ignore = "0.4.26"
model2vec-rs = { version = "0.2.1", default-features = false, features = ["hf-hub", "fancy-regex"], optional = true }
notify = "8.2.0"
rayon.workspace = true
regex.workspace = true
rusqlite.workspace = true
# Sourcegraph SCIP protobuf types for the SCIP-oracle pass (#61/#68). Normal dependency — the
# size budget is explicitly waived for SCIP; do NOT feature-gate or hand-copy the proto.
# `protobuf` is scip's own transitive dep, pulled in directly so we can call `Message::parse_*`
# on the generated SCIP types; pinned to the version scip 0.8 generates against.
protobuf = "3.7"
scip = "0.8.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
toon-format.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
ureq.workspace = true
# Dictionary-trained zstd compression of stored chunk text (#77 Phase 2). One shared dictionary
# trained on a corpus sample (zdict_builder) + bulk one-shot compress/decompress per chunk blob.
zstd = "0.13"
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-kotlin.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = ["fastembed", "model2vec"]
fastembed = ["dep:fastembed"]
model2vec = ["dep:model2vec-rs"]
# Search-quality + SCIP-oracle precision/recall eval harness (the `crate::eval` module). OFF by
# default so the shipped client doesn't carry it; built only in CI (the eval gate) via
# `--features eval`.
eval = []

[dev-dependencies]
# Instruction-count benchmarking (deterministic, CI-noise-immune). Needs the matching
# `iai-callgrind-runner` binary on PATH + valgrind installed. See benches/rag_pipeline.rs.
iai-callgrind = "0.16"
# Wall-clock benchmarking (full-index time on a larger corpus). default-features off to skip the
# plotting deps — Bencher parses criterion's stdout estimates.
criterion = { version = "0.8", default-features = false }
tempfile.workspace = true

# iai-callgrind: deterministic instruction counts (index + cold/warm query).
[[bench]]
name = "rag_pipeline"
harness = false

# criterion: wall-clock full-index time.
[[bench]]
name = "index_time"
harness = false

# criterion: wall-clock clone-query time (candidate gen, reverse lookup, cold find_clones) — #279.
[[bench]]
name = "clone_time"
harness = false
