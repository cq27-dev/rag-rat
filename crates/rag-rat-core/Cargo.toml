[package]
name = "rag-rat-core"
version.workspace = true
description = "Repository evidence engine for source chunks, symbols, graph edges, Git history, GitHub rationale, and source-bound memories."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
rag-rat-base.workspace = true
rag-rat-clones.workspace = true
rag-rat-db.workspace = true
rag-rat-dream.workspace = true
rag-rat-llm = { workspace = true, default-features = false }
rag-rat-papertrail.workspace = true
tokio = { workspace = true }
anyhow.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
hkdf.workspace = true
x25519-dalek.workspace = true
fastembed = { workspace = true, optional = true }
getrandom.workspace = true
futures-util.workspace = true
gix.workspace = true
httpdate.workspace = true
ignore = "0.4.26"
model2vec-rs = { version = "0.2.1", default-features = false, features = ["hf-hub", "fancy-regex"], optional = true }
notify = "8.2.0"
pulldown-cmark.workspace = true
rayon.workspace = true
regex.workspace = true
rusqlite.workspace = true
# scip/protobuf stay direct deps: eval + query_api tests build SCIP fixtures in-process.
protobuf.workspace = true
rag-rat-oracle.workspace = true
rag-rat-oplog.workspace = true
rag-rat-query.workspace = true
reqwest.workspace = true
scip.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
stacker.workspace = true
strum.workspace = true
thiserror.workspace = true
toml.workspace = true
toon-format.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
ureq.workspace = true
# Dictionary-trained zstd compression of stored chunk text (#77 Phase 2). One shared dictionary
# trained on a corpus sample (zdict_builder) + bulk one-shot compress/decompress per chunk blob.
zstd = "0.13"
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-kotlin.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-swift.workspace = true
tree-sitter-typescript.workspace = true
minicbor.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = ["fastembed", "model2vec"]
fastembed = ["dep:fastembed", "rag-rat-llm/fastembed"]
model2vec = ["dep:model2vec-rs", "rag-rat-llm/model2vec"]
# Search-quality + SCIP-oracle precision/recall eval harness (the `crate::eval` module). OFF by
# default so the shipped client doesn't carry it; built only in CI (the eval gate) via
# `--features eval`.
eval = ["rag-rat-llm/eval"]

[dev-dependencies]
# Instruction-count benchmarking (deterministic, CI-noise-immune). Needs the matching
# `iai-callgrind-runner` binary on PATH + valgrind installed. See benches/rag_pipeline.rs.
iai-callgrind = "0.16"
# Wall-clock benchmarking (full-index time on a larger corpus). default-features off to skip the
# plotting deps — Bencher parses criterion's stdout estimates.
criterion = { version = "0.8", default-features = false }
# Test-only: forward-slashes a filesystem path so it can be embedded in a double-quoted TOML string
# value without Windows `\U`/`\R` invalid-escape parse errors (config load tests).
path-slash.workspace = true
tempfile.workspace = true

# iai-callgrind: deterministic instruction counts (index + cold/warm query).
[[bench]]
name = "rag_pipeline"
harness = false

# criterion: wall-clock full-index time.
[[bench]]
name = "index_time"
harness = false

# criterion: wall-clock clone-query time (candidate gen, reverse lookup, cold find_clones) — #279.
[[bench]]
name = "clone_time"
harness = false
